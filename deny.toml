# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
#
# Run locally with: cargo deny check

[advisories]
version = 2
# RUSTSEC advisory IDs to ignore, with a justification comment each.
ignore = [
    # paste unmaintained. Build-time-only proc-macro helper, pulled transitively
    # (no runtime code); no maintained drop-in replacement across the tree.
    "RUSTSEC-2024-0436",
    # chrono unmaintained. An informational notice, not a vulnerability, and no
    # version fixes it. sea-orm and sqlx require chrono, so it stays in the tree
    # whatever zm-api's own code uses. Revisit when they offer another time crate.
    "RUSTSEC-2026-0543",
]

[bans]
# The dependency tree currently carries some duplicate versions via
# transitive crates; surface them as warnings rather than hard failures.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
# Permissive licenses acceptable for this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    # zm-api's own license (the workspace crate is scanned too).
    "AGPL-3.0-or-later",
    # Permissive licenses carried by transitive deps.
    "CDLA-Permissive-2.0",
    "WTFPL",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
