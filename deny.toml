# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
#
# Run locally with: cargo deny check

[advisories]
version = 2
# RUSTSEC advisory IDs to ignore, with a justification comment each.
ignore = [
    # rsa "Marvin Attack" timing side-channel. No fixed `rsa` release exists and
    # the crate is pulled in transitively (and unavoidably) by sqlx-mysql for the
    # MariaDB/MySQL auth handshake — it is not used for any attacker-facing crypto
    # in zm-api. Exploitation requires timing many RSA private-key operations;
    # mitigated by a local/TLS database connection. Revisit when sqlx drops rsa.
    "RUSTSEC-2023-0071",
    # atomic-polyfill unmaintained. Deep transitive build-dep only
    # (garde -> phonenumber -> postcard -> heapless), no safe upgrade available.
    "RUSTSEC-2023-0089",
    # rkyv 0.7.46 out-of-bounds read. The fix is rkyv >=0.8.17, but 0.7.46 is
    # pulled transitively by the webrtc/dtls stack, which pins the 0.7 line; the
    # directly-reachable rkyv (0.8.x) is already upgraded to 0.8.17. rkyv is not
    # used to deserialize attacker-controlled archives in zm-api. Revisit when
    # webrtc bumps rkyv to 0.8.
    "RUSTSEC-2026-0235",
    # paste unmaintained. Build-time-only proc-macro helper, pulled transitively
    # (no runtime code); no maintained drop-in replacement across the tree.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 unmaintained. Build-time-only derive-macro dependency;
    # unmaintained but not a vulnerability. Revisit if a maintained fork lands.
    "RUSTSEC-2026-0173",
]

[bans]
# The dependency tree currently carries some duplicate versions via
# transitive crates; surface them as warnings rather than hard failures.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
# Permissive licenses acceptable for this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    # zm-api's own license (the workspace crate is scanned too).
    "AGPL-3.0-or-later",
    # Permissive licenses carried by transitive deps.
    "CDLA-Permissive-2.0",
    "WTFPL",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
