name: Release

# Builds distribution packages for all supported ZoneMinder families and, on a
# version tag, publishes them to a GitHub Release. Push a tag like `v3.0.0`
# (must match the version in Cargo.toml / spec / PKGBUILD), or run manually via
# workflow_dispatch to build artifacts without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap gate: catch a half-finished version bump before spending three
  # package builds on it. The four version strings are hand-synced.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-version-consistency.sh

  # Debian/Ubuntu/Raspberry Pi OS — the flagship, built natively per arch.
  deb:
    name: deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg/OpenSSL dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - uses: dtolnay/rust-toolchain@stable

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.FFMPEG_KEY }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        # Build every bin target first: the asset list ships `migrator` as
        # zm-api-db alongside the server, and cargo-deb only copies paths.
        run: |
          cargo build --release --bins
          cargo deb --no-build

      - name: Sanity-check package (no private keys, lists files)
        run: |
          deb=$(ls target/debian/*.deb | head -1)
          if dpkg-deb -c "$deb" | grep -qE '\.pem($|[^a-z])'; then
            echo "ERROR: package contains .pem key material" >&2
            dpkg-deb -c "$deb" | grep '\.pem' >&2
            exit 1
          fi
          dpkg-deb -c "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  # Fedora/RHEL/Rocky/Alma and openSUSE, built from packaging/rpm/zm-api.spec.
  # Deps are requested via pkgconfig() capabilities so each distro resolves its
  # own FFmpeg/OpenSSL -devel packages (Fedora's *-free-devel, openSUSE's, ...).
  rpm:
    name: rpm (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:44
            install: dnf -y install
          - distro: opensuse
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # Install git (for checkout) + the build toolchain before checkout runs.
      - name: Install toolchain and build dependencies
        run: |
          ${{ matrix.install }} \
            git tar gzip rpm-build rust cargo gcc systemd-rpm-macros \
            clang clang-devel \
            'pkgconfig(openssl)' \
            'pkgconfig(libavcodec)' 'pkgconfig(libavformat)' \
            'pkgconfig(libavutil)' 'pkgconfig(libavfilter)' \
            'pkgconfig(libavdevice)' 'pkgconfig(libswscale)' \
            'pkgconfig(libswresample)'

      - uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM
        run: bash scripts/package.sh rpm

      - name: Collect RPMs
        run: |
          mkdir -p out
          find "$(rpm --eval %_topdir)/RPMS" -name '*.rpm' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: out/*.rpm
          if-no-files-found: error

  # Arch Linux via packaging/arch/PKGBUILD. makepkg refuses to run as root, so
  # we build as a dedicated user with build deps pre-installed (makepkg -d).
  arch:
    name: arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel git rust ffmpeg openssl clang

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          useradd -m builder
          cp -r packaging/arch /tmp/build
          # Build from the checked-out source instead of downloading the tag
          # tarball: pre-stage the archive makepkg expects (matching the
          # PKGBUILD's source filename and extracted dir), so it builds on
          # dispatch/branch runs too — not only published tags.
          pkgver=$(sed -n 's/^pkgver=//p' /tmp/build/PKGBUILD | head -1)
          pkgtag=$(sed -n 's/^_pkgtag=//p' /tmp/build/PKGBUILD | head -1)
          # The checkout is owned by a different uid than root in the container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix="zm-api-${pkgtag#v}/" \
            -o "/tmp/build/zm-api-${pkgver}.tar.gz" HEAD
          chown -R builder:builder /tmp/build
          # makepkg refuses root; runuser (util-linux) avoids needing sudo.
          # -d skips dep checks (deps pre-installed above); the staged tarball
          # plus sha256sums=SKIP means makepkg uses it rather than downloading.
          runuser -u builder -- bash -c 'cd /tmp/build && makepkg -d --noconfirm'
          mkdir -p out && cp /tmp/build/*.pkg.tar.zst out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  # Attach every artifact that built and passed its install test to the GitHub
  # Release. Runs on tags only; `always()` so a single distro failure still
  # publishes the rest.
  # The OpenAPI spec as a release asset: lets the API surface be diffed between
  # releases and fed to a client generator without standing a server up.
  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg/OpenSSL dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - uses: dtolnay/rust-toolchain@stable

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.FFMPEG_KEY }}

      - name: Export spec
        run: cargo run --release --bin zm-api -- --openapi > openapi.json

      - name: Sanity-check spec
        run: |
          python3 -c "
          import json, sys
          spec = json.load(open('openapi.json'))
          paths = len(spec.get('paths', {}))
          print(f'openapi {spec[\"openapi\"]}, {paths} paths')
          sys.exit(0 if paths > 50 else 'suspiciously few paths')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  # Install every package on a host running systemd and walk the install
  # process before anything is published (packaging/e2e). The .deb is tested
  # beside a ZoneMinder built from upstream master: passive, takeover, revert,
  # upgrade, removal. A package that passes leaves a `verified-*` marker, and
  # only marked packages are published.
  install-test:
    name: install test (${{ matrix.distro }} ${{ matrix.arch }})
    needs: [deb, rpm, arch]
    # Run for the packages that did build even if another build failed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, arch: amd64, runner: ubuntu-24.04, artifact: deb-amd64 }
          - { distro: ubuntu-24.04, arch: arm64, runner: ubuntu-24.04-arm, artifact: deb-arm64 }
          - { distro: fedora-44, arch: amd64, runner: ubuntu-24.04, artifact: rpm-fedora }
          - { distro: opensuse-tumbleweed, arch: amd64, runner: ubuntu-24.04, artifact: rpm-opensuse }
          - { distro: arch, arch: amd64, runner: ubuntu-24.04, artifact: arch-pkg }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg

      - name: Install it and walk the install process
        run: packaging/e2e/run.sh ${{ matrix.distro }} --package pkg

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs-${{ matrix.artifact }}
          path: target/e2e/${{ matrix.distro }}/logs
          if-no-files-found: ignore

      - name: Mark the package verified
        run: echo "${{ matrix.artifact }} passed its install test at ${{ github.sha }}" > verified.txt

      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.artifact }}
          path: verified.txt

  release:
    name: Publish release
    needs: [deb, rpm, arch, openapi, install-test]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # One directory per artifact, so a package can be matched to its marker.
      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # A package is published only if its install test passed. One that failed
      # is held back with a warning, and the rest still go out.
      - name: Keep verified packages
        run: |
          mkdir -p artifacts
          for dir in downloaded/*/; do
            name="$(basename "$dir")"
            case "$name" in
              verified-*|packaging-logs-*) ;;
              deb-*|rpm-*|arch-pkg)
                if [ -d "downloaded/verified-$name" ]; then
                  cp "$dir"* artifacts/
                else
                  echo "::warning title=Package held back::$name did not pass its install test and is not published"
                fi ;;
              *) cp "$dir"* artifacts/ ;;
            esac
          done

      - name: List artifacts
        run: ls -lR artifacts || true

      # So a downloader can verify what they got. Paths are flattened to bare
      # filenames, which is how they appear on the release page.
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS' -printf '%P\n' \
            | sort \
            | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      # The hand-written entry for this version, if CHANGELOG.md has one. Falls
      # back to GitHub's generated commit list, which is better than nothing but
      # says little to someone deciding whether to upgrade.
      - uses: actions/checkout@v4
        with: { path: src }

      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if awk -v v="$version" '
                /^## \[/ { inside = index($0, "[" v "]") > 0; next }
                inside   { print }
              ' src/CHANGELOG.md > notes.md && [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no CHANGELOG.md entry for ${version}; using generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: false
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          # Any SemVer pre-release tag (contains a hyphen, e.g. v3.0.0-alpha.1)
          # is published as a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
