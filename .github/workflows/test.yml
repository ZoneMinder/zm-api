name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    env:
      APP_PROFILE: test-db
    
    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: zm_test
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_root_pass
          POSTGRES_USER: postgres
          POSTGRES_DB: zm_test_pg
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Generate JWT keys
        run: bash scripts/generate-jwt-keys.sh

      # ffmpeg-sys-next links the FFmpeg shared libraries via pkg-config.
      # ubuntu-latest preinstalls only the ffmpeg binary, not the -dev
      # packages, so the dev libraries must be installed explicitly.
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ env.FFMPEG_KEY }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup test databases
        run: |
          chmod +x ./scripts/setup-ci-db.sh
          
          # Setup both MySQL and PostgreSQL with schema
          ./scripts/setup-ci-db.sh both
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
          MYSQL_DATABASE: zm_test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_root_pass
          POSTGRES_DB: zm_test_pg

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run integration tests
        run: cargo test --no-fail-fast --test '*' -- --include-ignored
        env:
          DATABASE_URL: mysql://zm_test_user:zm_test_pass@127.0.0.1:3307/zm_test

      # Fixtures clean up after themselves via the RowGuard RAII helper, so a
      # clean run must leave zero `Test_run_*` rows behind. Runs even when tests
      # fail (`always()`) so a leak is visible rather than masked. The DB is
      # ephemeral and the suite has just finished, so any leftover row is a real
      # leak regardless of age — hence `--max-age-secs 0`.
      - name: Check for leaked fixture rows
        if: always()
        run: cargo run --bin fixture-doctor -- --max-age-secs 0
        env:
          DATABASE_URL: mysql://zm_test_user:zm_test_pass@127.0.0.1:3307/zm_test

  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # clippy compiles the crate, so ffmpeg-sys-next needs the dev libraries.
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      APP_PROFILE: test-db

    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: zm_test
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_root_pass
          POSTGRES_USER: postgres
          POSTGRES_DB: zm_test_pg
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Generate JWT keys
        run: bash scripts/generate-jwt-keys.sh

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup test databases
        run: |
          chmod +x ./scripts/setup-ci-db.sh
          ./scripts/setup-ci-db.sh both
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
          MYSQL_DATABASE: zm_test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_root_pass
          POSTGRES_DB: zm_test_pg

      # Measures unit + integration coverage. entity/ and migration/ are
      # excluded as generated code. `--fail-under-lines` is the regression
      # floor: baseline is ~62% line coverage, so 60 leaves headroom —
      # ratchet it up as new tests land.
      # `--ignore-run-fail`: the test job is the test gate; this job only
      # gates coverage, so a failing test here must not mask the number.
      - name: Run coverage
        run: |
          cargo llvm-cov --all-features --ignore-run-fail \
            --ignore-filename-regex '/(entity|migration)/' \
            --fail-under-lines 60 \
            -- --include-ignored
        env:
          DATABASE_URL: mysql://zm_test_user:zm_test_pass@127.0.0.1:3307/zm_test

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Ignored advisories are documented in deny.toml; cargo-audit does not
      # read that file, so the ignore list is mirrored here. Keep the two in
      # sync. RUSTSEC-2023-0071: unfixable rsa transitive dep via sqlx-mysql.
      # RUSTSEC-2026-0235: rkyv 0.7.46 via webrtc/dtls (0.8.x is upgraded).
      # RUSTSEC-2026-0367/0368/0369: zip 3 build-dep of utoipa-swagger-ui 9.
      - name: Audit dependencies for known vulnerabilities
        run: >-
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369

      - name: Check advisories, licenses and sources
        run: cargo deny check

  openapi-compat:
    name: OpenAPI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install FFmpeg/OpenSSL dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - uses: dtolnay/rust-toolchain@stable

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.FFMPEG_KEY }}

      # `--openapi` needs no database and no configuration.
      - name: Export the current spec
        run: cargo run --bin zm-api -- --openapi > /tmp/openapi-current.json

      # Fails only on changes that can break a deployed client — a removed
      # endpoint, a replaced response shape, a response field that is no longer
      # guaranteed, a dropped enum value, or a request that gained a required
      # field. New endpoints and new optional fields pass with a notice.
      #
      # `GET /me` changed from UserResponse to MeResponse with no announcement
      # and broke the dashboard's permission gating (GH #62); this is the guard
      # that would have caught it in the pull request.
      - name: Compare against the committed baseline
        run: python3 scripts/check-openapi-compat.py openapi.json /tmp/openapi-current.json

  schema-parity:
    name: Baseline Schema Parity
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: zm_test
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ env.FFMPEG_KEY }}-cargo-parity-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify generated migrations are in sync with their generators
        run: |
          python3 scripts/gen_baseline_migration.py --snapshot db/baseline-1.39.1
          python3 scripts/gen_baseline_migration.py --emit-mysql-triggers src/migration/upstream/triggers_1_39_26.rs
          python3 scripts/gen_legacy_chain.py --zm-version "$(grep -o 'CUTOVER_ZM_VERSION: &str = "[^"]*"' src/migration/legacy_bridge/chain.rs | cut -d'"' -f2)"
          git diff --exit-code src/migration/m00000000_000001_zm_baseline/ src/migration/upstream/triggers_1_39_26.rs src/migration/legacy_bridge/chain.rs db/legacy/ \
            || { echo "::error::generated migration code is stale - rerun the generators (see docs/DB_VERSIONING_PLAN.md)"; exit 1; }

      - name: Run schema parity check
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_ROOT_PASSWORD: test_root_pass
        run: ./scripts/schema-parity.sh

  postgres-schema:
    name: Postgres Schema (migrator up)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: zm_test
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_root_pass
          POSTGRES_USER: postgres
          POSTGRES_DB: zm_test_pg
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - uses: actions/checkout@v6

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ env.FFMPEG_KEY }}-cargo-parity-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Postgres schema check
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_ROOT_PASSWORD: test_root_pass
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          POSTGRES_PASSWORD: test_root_pass
        run: ./scripts/postgres-schema.sh

  upgrade-parity:
    name: Upgrade Parity (from ${{ matrix.zm_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zm_version: ["1.34.26", "1.36.35", "1.38.3"]

    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: zm_test
          MYSQL_USER: zm_test_user
          MYSQL_PASSWORD: zm_test_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavutil-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavcodec-dev libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Build caches hold objects compiled against this runner's FFmpeg. When
      # GitHub moves ubuntu-latest to a new release, an old cache links against
      # the new libraries and fails on removed functions, so key on the version.
      - name: Key the build cache to this FFmpeg
        run: echo "FFMPEG_KEY=$(. /etc/os-release; echo "$ID-$VERSION_ID")-avcodec-$(pkg-config --modversion libavcodec)" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ env.FFMPEG_KEY }}-cargo-parity-${{ hashFiles('**/Cargo.lock') }}

      - name: Run upgrade parity from ${{ matrix.zm_version }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_ROOT_PASSWORD: test_root_pass
        run: ./scripts/upgrade-parity.sh ${{ matrix.zm_version }}
