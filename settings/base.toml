[server]
addr = "0.0.0.0"
port = 8080
# Browser origins allowed to call the API (CORS). Set this whenever a dashboard
# (zm-web) is served from anything other than localhost — browsers block the
# requests otherwise, and the only symptom is in the browser console.
#
# Each entry is an exact origin ("https://zm.example.com") or a host with a ":*"
# port wildcard ("http://localhost:*") matching that host on any port. A bare
# "*" is not accepted: credentials are enabled and the CORS spec forbids that
# pairing. Empty means localhost only.
#
# Same-origin deployments (zm-web behind the same hostname via a reverse proxy)
# make no CORS request and need nothing here.
#
# Override per-host with: APP_SERVER__ALLOWED_ORIGINS=https://zm.example.com
allowed_origins = []

# Serving the zm-web browser UI from this binary, instead of putting nginx in
# front of both. One process, no CORS (the UI and the API share an origin by
# construction), and TLS is already handled by [server.tls] / [server.acme].
#
# Off by default: a deployment fronted by a reverse proxy or CDN should keep
# serving the files there. Enabling it changes what `/` returns.
#
# API paths (/api/, /swagger-ui, /api-docs) keep their JSON 404 envelope — the
# SPA fallback never swallows them, so a mistyped endpoint still fails loudly.
[web]
enabled = false
# Where zm-web's built dist/ lives — the directory containing index.html.
root = "/usr/share/zm-web"
# Asset filenames are content-hashed, so a year is safe. index.html is always
# sent no-cache: it names the current hashes, and caching it pins a browser to
# a stale build.
asset_max_age_secs = 31536000
# Sent on UI responses only, never on API responses. Empty disables it.
content_security_policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[server.tls]
enabled = false
cert_path = "/etc/letsencrypt/live/example.com/fullchain.pem"
key_path = "/etc/letsencrypt/live/example.com/privkey.pem"

[server.acme]
enabled = false
domains = []
contact_emails = []
cache_dir = "/var/lib/zm-api/acme"
production = false
challenge = "tls-alpn-01"
http_port = 80

# HTTP middleware tuning.
[server.middleware]
# Maximum accepted request body size, in bytes (2 MiB).
body_limit_bytes = 2097152
# Global per-client-IP rate limit. `rate_limit_period_secs` is a *period*: one
# request's worth of budget is restored every this many seconds. 0 disables the
# limiter entirely; prod.toml enables it.
#
# `rate_limit_burst` is how many requests a client may make before the refill
# rate binds, and it is the number that decides whether a browser page load
# works — a single-page app renders one screen from a dozen or so requests, so
# a burst below that means no page ever loads. Leaving it at 0 with the limiter
# enabled is a misconfiguration; the server substitutes a usable value and logs
# an error rather than serving one request and refusing the rest.
#
# The old name `rate_limit_per_second` is still accepted. It read as a rate and
# meant the opposite, so setting it to 4 expecting four requests a second gave
# one request every four seconds.
rate_limit_period_secs = 0
rate_limit_burst = 0
# Key rate limits on the client address a reverse proxy passes on
# (X-Forwarded-For / X-Real-IP) instead of the proxy's own. The headers are
# believed only on connections from `trusted_proxies`; anyone else is keyed on
# their own address whatever they send. The client is the rightmost
# X-Forwarded-For address that isn't a trusted proxy, since proxies append to
# what the client sent.
trust_proxy_headers = false
# Addresses or CIDRs. Loopback covers a proxy on the same host. Add a proxy's
# address if it runs elsewhere.
trusted_proxies = ["127.0.0.0/8", "::1/128"]
# Dedicated tighter limit on the auth endpoints (/auth/*, /me*), on by default
# so credential brute-forcing is throttled even when the global limiter is off.
# Period is the replenish interval in seconds; burst is the allowance. Set
# either to 0 to disable.
auth_rate_limit_period_secs = 2
auth_rate_limit_burst = 10

# Database configuration
# By default, uses ZoneMinder's zm.conf settings (/etc/zm/zm.conf + conf.d/)
# Override here or via environment variables (APP_DB__HOST, etc.) if needed
[db]
# These placeholder values trigger zm.conf fallback
host = "localhost"
port = 3306
# Unix socket, instead of TCP. Unset with host = "localhost", the standard
# MariaDB/MySQL socket is used when one exists, as libmysqlclient (and so
# ZoneMinder) does: a 'zmuser'@'localhost' grant matches socket connections
# only. ZM_DB_HOST=localhost:/path/to/socket in zm.conf sets it too.
# socket = "/run/mysqld/mysqld.sock"
username = "username"
password = "password"
database_name = "database_name"
# Connection pool tuning.
max_connections = 25
min_connections = 5
connect_timeout_secs = 8
acquire_timeout_secs = 8
idle_timeout_secs = 300
max_lifetime_secs = 1800
# Log every SQL statement. Verbose; enable only for local debugging.
sqlx_logging = false

[sentry]
# Sentry error reporting - disabled by default for privacy
# Users can enable and provide their own DSN if desired
enabled = false
dsn = ""

[env]
RUST_LOG = "info"
[secret]
private_access_key = "static/key/private_access_rsa_key.pem"
public_access_key = "static/key/public_access_rsa_key.pem"
private_refresh_key = "static/key/private_refresh_rsa_key.pem"
public_refresh_key = "static/key/public_refresh_rsa_key.pem"

[http]
timeout = 10

# Streaming configuration for RTSP/WebRTC/HLS
[streaming]
enabled = true
default_protocol = "auto"

[streaming.source]
priority = ["socket", "rtsp", "go2rtc"]
prefer_direct_rtsp = false
fallback_to_go2rtc = true
cache_sdp_seconds = 300
# Keep these monitors' stream-socket readers hot so the first WebRTC/HLS viewer
# skips cold spin-up (instant codec + a ready keyframe). Empty = none.
prewarm_monitors = []
# How often the warm-keeper re-ensures each prewarm reader is alive. 0 disables.
prewarm_interval_seconds = 30

[streaming.zoneminder]
enabled = true
# Directory holding zmc's per-monitor stream sockets (ZM_PATH_SOCKS):
# {socks_path}/stream_{monitor_id}.sock
# Left at /run/zm, ZM_PATH_SOCKS from /etc/zm/zm.conf is used when it is set.
socks_path = "/run/zm"
read_timeout_ms = 10000
reconnect_delay_ms = 1000


[streaming.webrtc]
enabled = true
mode = "go2rtc"
max_connections = 100
connection_timeout_seconds = 30
stun_servers = ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"]
# Media ports: by default each session gets an ephemeral UDP port from the OS.
# Set a range to forward through a firewall or publish from a container (one
# port per viewer):
# udp_port_min = 50000
# udp_port_max = 50099
# Public address to advertise instead of this host's own (1:1 NAT, Docker):
# nat_ips = ["203.0.113.10"]
# A TURN server is needed for viewers behind symmetric NAT, where STUN alone
# cannot establish a path. Media is relayed through it, so size accordingly.
# [streaming.webrtc.turn]
# enabled = true
# server = "turn:turn.example.com:3478"
# username = "zm"
# password = "change-me"

[streaming.hls]
enabled = true
segment_duration_seconds = 2
playlist_size = 10
ll_hls_enabled = true
partial_segment_ms = 200

[streaming.hls.storage]
path = "/tmp/hls"
retention_minutes = 10


# zm-api's RTSP server: live video for Home Assistant, VLC and NVRs, opened by
# a signed link from POST /api/v3/live/{id}/rtsp/link. TCP (interleaved) only.
# ZoneMinder's own zm_rtsp_server also defaults to 8554: run one or the other.
[streaming.rtsp]
enabled = false
bind = "0.0.0.0"
port = 8554
# RTSPS with server.tls's certificate and key:
# tls_port = 8322
# Host name in the links; defaults to the host the link request was sent to.
# public_host = "zm.example.com"
max_connections = 64

[synopsis]
enabled = false
encoder_backend = "native"
render_timeout_seconds = 120
max_concurrent_renders = 2
# Days a rendered artifact is kept before the cleanup job removes it (0 = keep).
retention_days = 7
cache_dir = "/var/lib/zm-api/synopsis"
# Output synopsis frame rate for the rendered mp4.
output_fps = 12
# Cap on tubes drawn into one output frame (0 = unlimited).
max_tubes_per_frame = 8
# Collision-area budget as a fraction of tube pixels — the condensation knob
# (0.02–0.10). Higher = denser/shorter; lower = sparser/longer.
collision_budget = 0.05
# Mask edge feather radius in pixels (1–2) to suppress cutout halos.
mask_feather_px = 1
# Monitor ids whose zm-next pipeline emits synopsis ingredients (polygon masks +
# tracker + review_export + plate_export). Empty = none; other cameras pay nothing.
enabled_monitors = []

# Natural-language / semantic event search over zm-next events. Off by default.
# All model inference is external local HTTP (chosen by URL, not in-process ONNX).
[search]
enabled = "off"        # off | auto | on  (auto = enable iff a vector backend is found)
backend = "auto"       # auto -> sqlite today (MySQL 8.0 has no native VECTOR); mariadb|postgres later
embed_dim = 384        # Matryoshka-truncate to 256-384
sqlite_path = "/var/lib/zm-api/search.db"
rerank = true
embed_url = "http://127.0.0.1:8090/embed"    # text(+image) embeddings (TEI/llama.cpp/Ollama)
rerank_url = "http://127.0.0.1:8090/rerank"  # cross-encoder reranker
router_url = "http://127.0.0.1:8091/v1"      # OpenAI-compatible LLM for the query router
router_model = "local"                       # model name for the router endpoint (often ignored)
image_embed = false    # also embed on-disk crop JPEGs (off = text-only)

# Daemon controller configuration (replaces zmdc.pl/zmpkg.pl)
[daemon]
# Passive by default so a fresh install cannot disturb a running ZoneMinder.
# That is the on-ramp, not the end state: takeover replaces zmdc.pl and
# zmwatch.pl with one native supervisor. Flip to true (and disable
# zoneminder.service) when ready — or use packaging/zm-api-takeover.sh, which
# sequences both services correctly in either direction.
enabled = false
# socket_path and bin_path left at these defaults follow ZM_PATH_SOCKS and
# ZM_PATH_BIN from /etc/zm/zm.conf, which differ by distribution.
socket_path = "/run/zm"
socket_name = "zmdc.sock"
# Group zmdc.sock is chgrp'd to so ZoneMinder's web user can reach it. Unset =
# ZM_WEB_GROUP from zm.conf. The zm-api service user must belong to it, which
# it does when it runs as ZoneMinder's account (the packaged default).
# socket_group = "www-data"
# On Ubuntu/Debian, both binaries and scripts are in /usr/bin
bin_path = "/usr/bin"
script_path = "/usr/bin"
min_backoff_seconds = 5
max_backoff_seconds = 900
shutdown_timeout_seconds = 30
stats_update_interval_seconds = 60
enable_socket_ipc = true
enable_rest_api = true

# Native replacements for ZoneMinder's Perl maintenance daemons. Each is
# independently switchable and all default off, so an existing install keeps
# running the Perl until you move over deliberately.
#
# Only one of a pair may run — both writing the same rows has them competing.
# In takeover mode zm-api will not start the Perl counterpart of an enabled
# job. In passive mode ZoneMinder is still the supervisor, so disable the Perl
# daemon there (Servers.zmstats, ZM_RUN_AUDIT, ZM_TELEMETRY_DATA) yourself.

# Replaces zmstats.pl. Samples CPU/memory into Server_Stats, evicts stale
# Monitor_Status heartbeats, ages events out of the Events_Hour/Day/Week/Month
# windows and resyncs the counters those feed, and prunes expired Sessions.
# Nothing here touches event media or Events rows.
[maintenance.stats]
enabled = false
interval_seconds = 300

# Replaces zmaudit.pl (database side). Removes Frames/Stats rows whose event is
# gone, deletes events that never recorded a frame, closes events left open by a
# capture daemon that died, and recomputes Event_Summaries and
# Storage.DiskSpace from the rows they summarise.
#
[maintenance.audit]
enabled = false
interval_seconds = 3600
# Report what would be removed without removing it. Leave this on for a pass or
# two and read the log before turning it off.
dry_run = true
# Ignore anything younger than this. An event has a row before it has frames, so
# without a grace period the sweep races the capture daemon.
min_age_seconds = 3600
remove_orphaned_frames = true
remove_empty_events = true
close_unclosed_events = true
resync_counters = true
# Cap per check within a pass (each sweep has its own budget): a misconfigured
# storage path can make a great many rows look orphaned at once, and this keeps
# the blast radius recoverable.
max_deletes_per_pass = 1000

# Reconciling event directories on disk against Events rows. Off even when the
# audit above is on, because it is the only part that touches the filesystem.
#
# Unlike zmaudit.pl, nothing destructive here acts on a computed path. zmaudit
# derives a directory from StartDateTime and rm -rf's it, which removes an
# unrelated directory whenever the derivation is wrong (timezone difference,
# corrupted timestamp, Scheme changed after recording, wrong StorageId).
# Directories are discovered by walking, identified from evidence inside them,
# and only an enumerated path is ever moved.
[maintenance.audit.filesystem]
enabled = false
# Move directories with no Events row into quarantine — a rename within the
# storage, so it is atomic and reversible.
quarantine_orphaned_dirs = true
# Delete Events rows whose directory was not found. Off by default: the evidence
# is an absence, and a storage that failed to mount looks like every event being
# gone. A pass refuses this when more rows are missing than events were found on
# disk, but leave it off unless broken-playback rows are actually a problem.
remove_rows_without_media = false
quarantine_dir = ".zm-api-quarantine"
# Remove quarantined directories after this many days. 0 keeps them forever,
# which fills the disk — the thing the audit exists to prevent.
quarantine_retention_days = 7
# Consecutive passes an orphan must be seen in before anything happens, so a row
# committed after a walk began is never mistaken for one.
confirmations_required = 2
# Deep needs six (yy/mm/dd/HH/MM/SS); deeper is not a layout ZoneMinder writes.
max_depth = 6

# Replaces zmtelemetry.pl. Anonymous usage report on a long interval.
#
# Unlike the Perl, this performs NO geolocation lookup. zmtelemetry.pl calls
# ipinfo.io on every collection and reports city/region/country/lat/long; those
# fields are still sent for compatibility but are always "Unknown".
[maintenance.telemetry]
enabled = false
interval_seconds = 1209600  # 14 days
endpoint = "https://telemetry.zoneminder.com/index.php"

[retention]
# Automatic recording-disk cleanup. Deletes whole events (media + DB rows)
# oldest-first, per Storage, when any limit below is breached. Off by default;
# never touches Archived or in-progress events, or the newest event per monitor.
enabled = false
interval_seconds = 300
# Disk-full safety net: keep each storage's filesystem at least this % free.
min_free_pct = 10.0
# 0 = disabled. Delete events older than N days.
max_age_days = 0
# 0 = disabled. Hard byte cap per storage.
max_bytes = 0
# Log what would be deleted without deleting (eyeball before enforcing).
dry_run = false
